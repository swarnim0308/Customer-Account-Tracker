# Test Configuration for Spring Boot Tests
# This configuration is used when running tests with @ActiveProfiles("test")

# Server Configuration
server.port=8089

# Security Configuration - Test credentials
spring.security.user.name=testuser
spring.security.user.password=testpass

# Spring MVC View Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# H2 Database Configuration - In-memory database for tests
spring.h2.console.enabled=false
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=WARN
logging.level.com.bank.custaccttracker=INFO
logging.level.org.springframework.test=INFO

